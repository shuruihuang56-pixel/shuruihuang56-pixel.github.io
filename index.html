<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二进制拨珠计数器（满二进一）</title>
<style>
    body {
        font-family: "Microsoft YaHei", sans-serif;
        background: #f4f7fa;
        text-align: center;
        padding: 40px;
    }

    h1 {
        margin-bottom: 20px;
    }

    .rule {
        margin-bottom: 25px;
        color: #666;
        font-size: 16px;
    }

    .abacus {
        display: flex;
        justify-content: flex-end; /* ✅ 第一位在最右 */
        gap: 35px;
        margin-bottom: 30px;
    }

    .rod {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .pole {
        width: 14px;
        height: 220px;
        background: linear-gradient(#888, #555);
        border-radius: 8px;
        position: relative;
    }

    .bead {
        width: 50px;
        height: 50px;
        background: #67c23a;
        border-radius: 50%;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 6px 12px rgba(0,0,0,.3);
        transition: top 0.4s ease, opacity 0.3s;
    }

    .controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
    }

    .controls button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        font-size: 20px;
        cursor: pointer;
    }

    .plus { background: #67c23a; color: white; }
    .minus { background: #f56c6c; color: white; }

    .label {
        margin-top: 10px;
        font-size: 14px;
        color: #555;
    }

    .binary-display {
        font-size: 40px;
        font-weight: bold;
        letter-spacing: 10px;
        margin-top: 20px;
    }

    .reset {
        margin-top: 30px;
    }

    .reset-btn {
        padding: 12px 30px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        background: #409eff;
        color: white;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>二进制拨珠计数器</h1>
<div class="rule">
    规则：每杆最多 2 颗珠，出现第 2 颗时立即消失并向左侧进 1
</div>

<div class="abacus">
    <!-- 第五位 -->
    <div class="rod" data-index="4">
        <div class="pole" id="pole4"></div>
        <div class="controls">
            <button class="plus" onclick="addOne(4)">+</button>
            <button class="minus" onclick="subOne(4)">−</button>
        </div>
        <div class="label">第五位</div>
    </div>

    <!-- 第四位 -->
    <div class="rod" data-index="3">
        <div class="pole" id="pole3"></div>
        <div class="controls">
            <button class="plus" onclick="addOne(3)">+</button>
            <button class="minus" onclick="subOne(3)">−</button>
        </div>
        <div class="label">第四位</div>
    </div>

    <!-- 第三位 -->
    <div class="rod" data-index="2">
        <div class="pole" id="pole2"></div>
        <div class="controls">
            <button class="plus" onclick="addOne(2)">+</button>
            <button class="minus" onclick="subOne(2)">−</button>
        </div>
        <div class="label">第三位</div>
    </div>

    <!-- 第二位 -->
    <div class="rod" data-index="1">
        <div class="pole" id="pole1"></div>
        <div class="controls">
            <button class="plus" onclick="addOne(1)">+</button>
            <button class="minus" onclick="subOne(1)">−</button>
        </div>
        <div class="label">第二位</div>
    </div>

    <!-- 第一位（最右） -->
    <div class="rod" data-index="0">
        <div class="pole" id="pole0"></div>
        <div class="controls">
            <button class="plus" onclick="addOne(0)">+</button>
            <button class="minus" onclick="subOne(0)">−</button>
        </div>
        <div class="label">第一位</div>
    </div>
</div>

<div class="binary-display" id="binaryDisplay">00000</div>

<div class="reset">
    <button class="reset-btn" onclick="resetAll()">一键重置</button>
</div>

<script>
    let beads = [[], [], [], [], []]; // beads[0] = 第一位（最右）

    function updatePole(index) {
        const pole = document.getElementById(`pole${index}`);
        pole.innerHTML = "";

        beads[index].forEach((_, i) => {
            const bead = document.createElement("div");
            bead.className = "bead";
            bead.style.top = `${140 - i * 55}px`;
            pole.appendChild(bead);
        });
    }

    function addOne(index) {
        beads[index].push(1);
        updatePole(index);

        // ✅ 满二进一
        if (beads[index].length === 2) {
            setTimeout(() => {
                beads[index] = [];
                updatePole(index);

                if (index < 4) {
                    addOne(index + 1); // 向左进位
                }
            }, 300);
        }

        updateBinary();
    }

    function subOne(index) {
        if (beads[index].length > 0) {
            beads[index].pop();
        }
        updatePole(index);
        updateBinary();
    }

    function updateBinary() {
        const bits = beads.map(b => b.length % 2);
        document.getElementById("binaryDisplay").innerText =
            bits.slice().reverse().join("");
    }

    function resetAll() {
        beads = [[], [], [], [], []];
        for (let i = 0; i < 5; i++) {
            updatePole(i);
        }
        updateBinary();
    }

    resetAll();
</script>

</body>
</html>
